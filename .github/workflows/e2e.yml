name: E2E

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Measured local pass time is under a second once the handshake completes,
    # and a hung handshake now fails fast (tests/e2e.test.mjs always closes
    # the loopback hub). 10 minutes leaves generous headroom for CI setup
    # (npm install, venv build) while catching any future hang in minutes,
    # not the six hours a prior run took before this cap existed.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # hivemind-js is not published to npm; the e2e drives the exact client the
      # page ships, so check it out and point HIVEMIND_JS_PATH at its hivemind.js.
      - name: Checkout HiveMind-js
        uses: actions/checkout@v7
        with:
          repository: JarbasHiveMind/HiveMind-js
          ref: dev
          path: hivemind-js-src

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install JS deps (ws)
        run: npm install --no-package-lock

      - name: Create the loopback-hub virtualenv
        run: |
          python -m venv /tmp/e2e-venv
          /tmp/e2e-venv/bin/python -m pip install --upgrade pip
          # hivescope provides the loopback hivemind-core hub the test drives.
          # hivescope >=0.5.2a1 floors the whole HiveMind 2.x stack itself
          # (hivemind-core>=4.6.2a1, hivemind-bus-client>=0.9.2a1,
          # ovos-bus-client>=2.0.0a3) with prerelease specifiers, so a plain
          # min-pin resolves the right stack — no --pre needed.
          /tmp/e2e-venv/bin/python -m pip install uv
          /tmp/e2e-venv/bin/uv pip install --python /tmp/e2e-venv/bin/python --prerelease=allow "hivescope>=0.5.2a1"

      - name: Run E2E (V1 client ↔ real loopback hub)
        env:
          E2E_PYTHON: /tmp/e2e-venv/bin/python
          HIVEMIND_JS_PATH: ${{ github.workspace }}/hivemind-js-src/static/js/hivemind.js
        run: npm test
